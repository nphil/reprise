openapi: 3.0.3
info:
  title: Reprise API
  version: '1.0'
  description: >-
    Saved results use exact original-file presentation milliseconds. Intervals are
    half-open and terminal is explicit; do not apply Marquee's two-second final-marker
    heuristic. Client credentials never authorize owner routes. All responses are no-store.
paths:
  /api/v1/results:
    get:
      summary: Look up a saved result without starting analysis
      security: [{clientBearer: []}]
      parameters:
        - {name: plex_machine_identifier, in: query, required: true, schema: {type: string}}
        - {name: rating_key, in: query, required: true, schema: {type: string}}
        - {name: media_id, in: query, required: true, schema: {type: string}}
        - {name: part_id, in: query, required: true, schema: {type: string}}
        - {name: part_key, in: query, required: true, schema: {type: string}, description: Token-free Plex part key}
        - {name: part_size_bytes, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: duration_ms, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: audio_stream_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Saved result or unresolved identity, content: {application/json: {schema: {$ref: '#/components/schemas/Lookup'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/jobs/{job_id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      summary: Read a job (jobs:read)
      security: [{clientBearer: []}]
      responses:
        '200': {description: Job status, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/analyses:
    post:
      summary: Request analysis of configured media (analysis:request)
      security: [{clientBearer: []}]
      requestBody: {$ref: '#/components/requestBodies/Analysis'}
      responses:
        '202': {description: Queued or existing matching job}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/reprise/media:
    get:
      summary: Browse configured media
      security: [{owner: []}]
      parameters:
        - {name: server_id, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: search, in: query, schema: {type: string}}
        - {name: show, in: query, schema: {type: string}}
        - {name: season, in: query, schema: {type: string}}
      responses:
        '200': {description: Media items and next_cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/reprise/refresh:
    post:
      summary: Queue a refresh of one enabled Plex library
      security: [{owner: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [server_id, library_id], properties: {server_id: {type: string}, library_id: {type: string}}}}}
      responses:
        '202': {description: "Queued refresh job; poll its id through GET /api/reprise/jobs/{job_id}"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/reprise/media/{media_id}/result:
    parameters: [{$ref: '#/components/parameters/MediaId'}]
    get:
      summary: Read owner review and evidence detail
      security: [{owner: []}]
      responses:
        '200': {description: Result and available playback identities}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/reprise/media/{media_id}/stream:
    parameters: [{$ref: '#/components/parameters/MediaId'}]
    get:
      summary: Stream the verified original file to the owner
      security: [{owner: []}]
      parameters: [{name: Range, in: header, schema: {type: string}, description: Single byte range}]
      responses:
        '200': {description: Full file}
        '206': {description: Requested byte range}
        '416': {description: Invalid or unsatisfiable range}
    head:
      summary: Inspect original file response headers
      security: [{owner: []}]
      responses:
        '200': {description: File headers}
        '206': {description: Range headers}
        '416': {description: Unsatisfiable range}
  /api/reprise/media/{media_id}/preview:
    parameters: [{$ref: '#/components/parameters/MediaId'}]
    post:
      summary: Queue a bounded browser-compatible preview
      security: [{owner: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [start_ms, end_ms, audio_stream_id], properties: {start_ms: {type: integer, minimum: 0}, end_ms: {type: integer}, audio_stream_id: {type: string}}}}}
      responses:
        '202': {description: Preview job}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/reprise/previews/{job_id}/stream:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      summary: Stream an owner preview artifact
      security: [{owner: []}]
      responses:
        '200': {description: Full preview}
        '206': {description: Requested byte range}
        '416': {description: Invalid byte range}
    head:
      summary: Inspect preview response headers
      security: [{owner: []}]
      responses:
        '200': {description: Preview headers}
        '206': {description: Range headers}
        '416': {description: Invalid byte range}
  /api/reprise/media/{media_id}/review:
    parameters: [{$ref: '#/components/parameters/MediaId'}]
    patch:
      summary: Save review, never publish
      security: [{owner: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, edits]
              properties:
                expected_revision: {type: integer, minimum: 0}
                edits:
                  type: array
                  items:
                    type: object
                    required: [range_id]
                    properties:
                      range_id: {type: string, nullable: true, description: Null creates a manual keep}
                      action: {type: string, enum: [skip, keep]}
                      kind: {type: string, enum: [intro, credits, recap, preview]}
                      start_ms: {type: integer}
                      end_ms: {type: integer}
                      review_status: {type: string, enum: [proposed, approved, rejected]}
                      locked: {type: boolean}
                      reason: {type: string}
      responses:
        '200': {description: Saved revision}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/reprise/analyses:
    post:
      summary: Request owner analysis
      security: [{owner: []}]
      requestBody: {$ref: '#/components/requestBodies/Analysis'}
      responses:
        '202': {description: Queued or existing job}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/reprise/settings:
    get:
      summary: Read publication availability and write status
      security: [{owner: []}]
      responses:
        '200':
          description: Publication availability and write status
          content: {application/json: {schema: {type: object, required: [publication_available, writes_enabled], properties: {publication_available: {type: boolean}, writes_enabled: {type: boolean}}}}}
    patch:
      summary: Explicitly enable or disable Plex writes (disabled by default)
      security: [{owner: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [writes_enabled], properties: {writes_enabled: {type: boolean}}}}}
      responses:
        '200': {description: Publication availability and write status}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/reprise/jobs:
    get:
      summary: List Reprise jobs
      security: [{owner: []}]
      responses:
        '200': {description: Object with items array of jobs}
  /api/reprise/jobs/{job_id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      summary: Read owner job status and completed preview location
      security: [{owner: []}]
      responses:
        '200': {description: Job status}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/reprise/jobs/{job_id}/{action}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - {name: action, in: path, required: true, schema: {type: string, enum: [pause, resume, cancel]}}
    post:
      summary: Control an existing Reprise job
      security: [{owner: []}]
      responses:
        '200': {description: Updated job}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/reprise/clients:
    get:
      summary: List named clients without secrets
      security: [{owner: []}]
      responses:
        '200': {description: Client array}
    post:
      summary: Create a client; secret is returned once
      security: [{owner: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClientCreate'}}}
      responses:
        '201': {description: Client with one-time secret}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/reprise/clients/{client_id}:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    delete:
      summary: Revoke a client
      security: [{owner: []}]
      responses:
        '204': {description: Revoked}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/reprise/clients/{client_id}/rotate:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    post:
      summary: Atomically replace a client secret
      security: [{owner: []}]
      responses:
        '200': {description: Replacement client and one-time secret}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/reprise/publications:
    get:
      summary: List durable publication history for recovery
      security: [{owner: []}]
      parameters: [{name: media_version_id, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {description: Object with publication items}
        '503': {description: Publication unavailable}
  /api/reprise/publications/prepare:
    post:
      summary: Prepare a publication without writing Plex
      security: [{owner: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_version_id, expected_revision, identity]
              properties:
                media_version_id: {type: string}
                expected_revision: {type: integer}
                identity: {$ref: '#/components/schemas/Identity'}
      responses:
        '200': {description: Prepared publication}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/reprise/publications/{change_id}/{action}:
    parameters:
      - {name: change_id, in: path, required: true, schema: {type: string}}
      - {name: action, in: path, required: true, schema: {type: string, enum: [apply, undo, recover]}}
    post:
      summary: Apply, undo, or classify an interrupted publication without replay
      security: [{owner: []}]
      responses:
        '200': {description: Publication status}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    clientBearer: {type: http, scheme: bearer, description: Named Reprise client token; required scope is endpoint-specific}
    owner: {type: apiKey, in: cookie, name: session, description: Owner session; mutations require CSRF token}
  parameters:
    MediaId: {name: media_id, in: path, required: true, schema: {type: string}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string}}
    ClientId: {name: client_id, in: path, required: true, schema: {type: string}}
  responses:
    BadRequest: {description: Invalid request}
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Missing scope or operation not permitted}
    NotFound: {description: Resource not found}
    Conflict: {description: Revision or publication conflict}
  requestBodies:
    Analysis:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [media_version_ids]
            properties:
              media_version_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string}}
              idempotency_key: {type: string, maxLength: 256}
  schemas:
    Identity:
      type: object
      additionalProperties: false
      required: [plex_machine_identifier, rating_key, media_id, part_id, part_key, part_size_bytes, duration_ms, audio_stream_id]
      properties:
        plex_machine_identifier: {type: string}
        rating_key: {type: string}
        media_id: {type: string}
        part_id: {type: string}
        part_key: {type: string}
        part_size_bytes: {type: integer, minimum: 1}
        duration_ms: {type: integer, minimum: 1}
        audio_stream_id: {type: string}
    Range:
      type: object
      required: [id, kind, action, start_ms, end_ms, review_status, locked, origin, reason_code, reason, evidence_ids, audio_stream_ids, terminal]
      properties:
        id: {type: string}
        kind: {type: string, enum: [intro, credits, recap, preview]}
        action: {type: string, enum: [skip, keep]}
        start_ms: {type: integer}
        end_ms: {type: integer}
        review_status: {type: string, enum: [proposed, approved, rejected]}
        locked: {type: boolean}
        origin: {type: string, enum: [detector, manual]}
        reason_code: {type: string}
        reason: {type: string}
        evidence_ids: {type: array, items: {type: string}}
        audio_stream_ids: {type: array, items: {type: string}}
        terminal: {type: boolean, default: false}
    Lookup:
      type: object
      required: [schema_version, resolution, analysis_status, freshness, media_version_id, analysis_id, result_revision, timebase, duration_ms, eligible_skip_ranges, protected_keep_ranges, proposed_ranges, reasons]
      properties:
        schema_version: {type: integer, enum: [1]}
        resolution: {type: string, enum: [resolved, unresolved, ambiguous, unsupported]}
        analysis_status: {type: string, enum: [missing, pending, running, complete, failed, cancelled, unsupported]}
        freshness: {type: string, enum: [current, stale, unavailable]}
        media_version_id: {type: string, nullable: true}
        analysis_id: {type: string, nullable: true}
        result_revision: {type: integer, nullable: true}
        timebase: {type: string, enum: [file_presentation_ms]}
        duration_ms: {type: integer, nullable: true}
        eligible_skip_ranges: {type: array, items: {$ref: '#/components/schemas/Range'}}
        protected_keep_ranges: {type: array, items: {$ref: '#/components/schemas/Range'}}
        proposed_ranges: {type: array, items: {$ref: '#/components/schemas/Range'}}
        reasons: {type: array, items: {type: string}}
    Job:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        progress: {type: number}
        created_at: {type: string}
    ClientCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        scopes: {type: array, uniqueItems: true, items: {type: string, enum: ['results:read', 'jobs:read', 'analysis:request']}}
