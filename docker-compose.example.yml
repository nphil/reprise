services:
  reprise:
    image: ${IMAGE:-ghcr.io/nphil/reprise@sha256:91571a47ff1108e4526ec3d2c449877c0aef69815f8d345d39ee3089b9939bd1}
    container_name: reprise
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /path/to/reprise/config:/config:rw
      - /path/to/media:/media:ro
