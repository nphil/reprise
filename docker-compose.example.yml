services:
  reprise:
    image: ${IMAGE:?Set IMAGE to a published immutable Reprise image tag or digest}
    container_name: reprise
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /path/to/reprise/config:/config:rw
      - /path/to/media:/media:ro
