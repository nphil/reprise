services:
  reprise:
    image: ${IMAGE:-ghcr.io/nphil/reprise@sha256:484b02fb7d2f12119384ff660a3d266d754fb88fb79a629c8d50278081947935}
    container_name: reprise
    restart: unless-stopped
    cpus: 1
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /run:rw,exec,nosuid,size=64m,mode=755
    ports:
      - "8080:8080"
    environment:
      PUID: "99"
      PGID: "100"
      TMP_FOLDER: "/config/tmp"
    volumes:
      - /path/to/reprise/config:/config:rw
      - /path/to/media:/media:ro
    # Optional GPU decoding (README: Optional GPU decoding). Uncomment what your host has; CPU is the default.
    # runtime: nvidia
    # devices:
    #   - /dev/dri/card1:/dev/dri/card1
    #   - /dev/dri/renderD129:/dev/dri/renderD129
    # group_add:
    #   - "18"   # numeric group of the render node: ls -ln /dev/dri
    # and under environment:
    #   NVIDIA_VISIBLE_DEVICES: "GPU-<uuid from nvidia-smi -L>"
    #   NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
