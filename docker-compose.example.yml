services:
  reprise:
    image: ${IMAGE:-ghcr.io/nphil/reprise@sha256:cfd007e23417dbb8c4dab8ce7e1e5c46b81acb1102bfdd30d4424175a1b2ec79}
    container_name: reprise
    restart: unless-stopped
    cpus: 1
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /run:rw,exec,nosuid,size=64m,mode=755
    ports:
      - "8080:8080"
    environment:
      PUID: "99"
      PGID: "100"
      TMP_FOLDER: "/config/tmp"
    volumes:
      - /path/to/reprise/config:/config:rw
      - /path/to/media:/media:ro
