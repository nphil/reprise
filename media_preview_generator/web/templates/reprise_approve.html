{% extends "base.html" %}
{% block title %}Review · Reprise{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/approve.css') }}">{% endblock %}
{% block content %}
<div class="lu-root ap" id="apRoot" data-view="queue" data-sharing-url="{{ url_for('main.reprise_sharing_page') }}" data-library-url="{{ url_for('main.reprise_page') }}">
  <div class="lu-page">
    <header class="lu-head">
      <div class="lu-col">
        <h1 class="lu-page-title" id="apTitle" tabindex="-1">Review</h1>
        <p class="lu-sub" id="apSub">Loading seasons…</p>
      </div>
    </header>
    <div id="apNotice" class="ap-notice"></div>
    <section id="apQueue" class="ap-queue" aria-label="Seasons to review" aria-busy="true"></section>
    <section id="apReview" class="ap-review" aria-label="Season review" hidden></section>
    <aside id="apSent" class="lu-tray ap-sent" aria-label="Recent changes and undo" hidden></aside>
  </div>
  <div class="lu-toasts" id="apToasts" role="status" aria-live="polite"></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/reprise-clip.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/reprise-approve.js') }}" defer></script>{% endblock %}
