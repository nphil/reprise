name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'unraid-templates/**'
      - 'docker-compose.example.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'unraid-templates/**'
      - 'docker-compose.example.yml'
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/nphil/reprise

concurrency:
  # Cancel superseded pull request checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege defaults for checks.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Pip cache keyed on this lint job's only dep (ruff). cache-hits
          # save ~5s; with this small a footprint the gain is small but
          # the cache is shared across runs of the lint job.
          cache: pip

      - name: Install ruff
        # Pin to match .pre-commit-config.yaml's ruff-pre-commit rev so the
        # commit-time gate and CI agree. Unpinned `pip install ruff` chased
        # latest and broke when 0.16 began reformatting code inside markdown
        # fences — a formatting change no committed file had been run through.
        run: pip install ruff==0.9.6

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Install actionlint
        uses: ./.github/actions/install-actionlint

      - name: actionlint (all workflows)
        run: actionlint -color

  typecheck:
    # The package is mypy-clean: a new error turns this check red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + mypy
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy

  ffmpeg-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build and boot disposable application image
        run: |
          set -euo pipefail
          docker buildx build --load --tag reprise-ci:local .
          trap 'docker logs reprise-ci-smoke 2>/dev/null || true; docker rm -f reprise-ci-smoke reprise-ci-export 2>/dev/null || true' EXIT
          docker run --rm --entrypoint /usr/local/bin/ffmpeg reprise-ci:local -L
          docker run --rm --entrypoint /usr/local/bin/ffmpeg reprise-ci:local -buildconf > ffmpeg-buildconf.txt
          cat ffmpeg-buildconf.txt
          grep -F -- '--enable-gpl' ffmpeg-buildconf.txt
          if grep -F -- '--enable-nonfree' ffmpeg-buildconf.txt; then
            echo 'Nonfree FFmpeg configuration must not be uploaded' >&2
            exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/ffmpeg reprise-ci:local -hide_banner -hwaccels > ffmpeg-hwaccels.txt
          cat ffmpeg-hwaccels.txt
          grep -x cuda ffmpeg-hwaccels.txt
          grep -x vaapi ffmpeg-hwaccels.txt
          docker create --name reprise-ci-export reprise-ci:local
          mkdir -p /tmp/reprise-ffmpeg/opt
          docker cp reprise-ci-export:/opt/ffmpeg-gpl /tmp/reprise-ffmpeg/opt/ffmpeg-gpl
          tar -C /tmp/reprise-ffmpeg -cf ffmpeg-bundle.tar opt/ffmpeg-gpl
          sha256sum ffmpeg-bundle.tar > ffmpeg-bundle.tar.sha256
          docker run -d --name reprise-ci-smoke --network none --tmpfs /config:rw -e PUID=1000 -e PGID=1000 reprise-ci:local
          for _ in {1..60}; do
            state="$(docker inspect -f '{{.State.Status}}' reprise-ci-smoke)"
            health="$(docker inspect -f '{{.State.Health.Status}}' reprise-ci-smoke)"
            if [ "$health" = healthy ]; then exit 0; fi
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then break; fi
            sleep 3
          done
          docker inspect -f '{{json .State.Health}}' reprise-ci-smoke
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-runtime-bundle
          path: |
            ffmpeg-bundle.tar
            ffmpeg-bundle.tar.sha256
          if-no-files-found: error
          retention-days: 1

  unit:
    # Shards the unit suite 3 ways so the required `test` check (below) only has to wait on
    # the slowest shard, not the whole unit suite serially. A repo ruleset requires a
    # status check literally named `test`, so this discovery job is named `unit` and the
    # combine job keeps the `test` id/name. pytest-shard balances by test count, not wall
    # time — locally that gave 4085/4307/4249 tests in 53.63s/45.91s/48.08s, close enough
    # (~15% spread) that a time-based split isn't worth the extra complexity.
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    needs: ffmpeg-build
    # A shard takes ~5 min; without a limit a hung step sits for GitHub's 6 h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and verify runtime FFmpeg
        uses: ./.github/actions/install-runtime-ffmpeg

      - name: Install mediainfo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mediainfo

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests (shard ${{ matrix.shard }}/3)
        # Deliberately does NOT clear addopts (pyproject.toml) and re-specify everything
        # it sets — that would duplicate the config and let a shard silently drift the
        # next time someone edits addopts. Only add what a shard needs on top:
        # --shard-id/--num-shards pick the slice, and --cov-fail-under is a `store`
        # action (last value on the command line wins over addopts' 70), so 0 here defers
        # the real floor to the `test` job below, which enforces it once over the
        # combined 3-shard total. addopts' own --cov-report=term-missing still runs and
        # prints its per-file table in each shard's log — harmless noise, not worth
        # fighting (pytest-cov's --cov-report is an *append* action, so cancelling it
        # from the CLI would need clearing addopts anyway).
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.shard }}
        run: >-
          python -m pytest --shard-id=$((${{ matrix.shard }} - 1)) --num-shards=3
          --cov-fail-under=0
          --ignore-glob=tests/test_docs_*.py
          --ignore=tests/test_readmes.py
          --ignore=tests/test_brand_assets.py
          --ignore=tests/test_site_claims.py
          --ignore=tests/test_site_urls.py
          --ignore=tests/test_llms_full.py
          --ignore=tests/test_sponsor_links.py

      - name: Upload coverage data (shard ${{ matrix.shard }}/3)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: .coverage.unit-${{ matrix.shard }}
          # The data file is a dotfile; upload-artifact skips hidden files by default
          # and would silently upload an empty artifact without this.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    # Required status check name — a repo ruleset pins the name `test`, so this job (not
    # `unit` above) is what that check watches. Combines the 3 shards' coverage data and
    # enforces the 70% floor once over the whole suite, matching what the single-job `test`
    # used to do.
    runs-on: ubuntu-24.04
    needs: unit
    # Run even when a unit shard fails. Without this the job is SKIPPED on a red shard, and
    # GitHub counts a skipped required check as passing — PR #351 merged red that way.
    if: ${{ !cancelled() }}
    steps:
      - name: Fail when any unit shard did not succeed
        if: needs.unit.result != 'success'
        run: |
          echo "::error::unit tests did not pass (result: ${{ needs.unit.result }}) — see the unit (n/3) jobs"
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage
        # coverage combine/report/xml is all this job does — no need for the app's own
        # deps or an editable install. Python 3.11+'s stdlib tomllib lets coverage.py read
        # pyproject.toml's [tool.coverage.*] natively, so no [toml] extra either.
        run: python -m pip install coverage

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-unit-*
          merge-multiple: true

      - name: Combine shard coverage and enforce the 70% floor
        # Unit and combine jobs use the same hosted runner workspace path.
        run: |
          python -m coverage combine .coverage.unit-1 .coverage.unit-2 .coverage.unit-3
          python -m coverage report --fail-under=70
          python -m coverage xml


  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: [lint, ffmpeg-build]
    strategy:
      # Don't cancel sibling shards if one fails. If shard 2's Chromium
      # crashes on test 35, we still want shards 1/3/4 to finish so
      # the failure is visibly isolated rather than masking the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mediainfo and Playwright Chromium runtime libs (cached)
        # Chromium's runtime libs (libnss3, libgtk, etc.) are installed here through the apt
        # cache so warm runs skip apt entirely; the playwright install below omits `--with-deps`.
        # Bump `version:` if any of these need to refresh.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            mediainfo
            libblas3
            liblapack3
            fonts-liberation
            libasound2t64
            libatk-bridge2.0-0t64
            libatk1.0-0t64
            libatspi2.0-0t64
            libcairo2
            libcups2t64
            libdbus-1-3
            libdrm2
            libgbm1
            libglib2.0-0t64
            libnspr4
            libnss3
            libpango-1.0-0
            libx11-6
            libxcb1
            libxcomposite1
            libxdamage1
            libxext6
            libxfixes3
            libxkbcommon0
            libxrandr2
            xvfb
          version: 4
          # A cache hit without post-install scripts leaves ffmpeg's libblas.so.3 /
          # liblapack.so.3 invisible to the dynamic linker.
          execute_install_scripts: true

      - name: Refresh dynamic linker cache for restored libs
        # The apt cache action skips the libc-bin trigger that rebuilds /etc/ld.so.cache, so on a cache
        # HIT ffmpeg can't find libblas.so.3 / liblapack.so.3 even though
        # the files are on disk.
        run: sudo ldconfig

      - name: Install and verify runtime FFmpeg
        uses: ./.github/actions/install-runtime-ffmpeg

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright Chromium (browser binary only; runtime libs cached above)
        run: playwright install chromium

      - name: Run e2e tests (shard ${{ matrix.shard }}/4)
        # Sharding strategy (Playwright's officially-documented pattern
        # for handling Chromium SIGSEGV on memory-constrained CI —
        # playwright.dev/docs/test-parallel). Each matrix shard runs
        # on its own ubuntu-latest runner = fresh Chromium = fresh
        # memory budget, so cross-test accumulation can't pile up
        # the way it did in the previous single-job design.
        #
        # The suite has grown: `pytest -m e2e --collect-only` gives 411
        # tests, so 4 shards is ~100-107 each (measured 103/107/100/101 —
        # pytest-shard balances it fine). That is well past the empirical
        # ~30-test Chromium crash threshold the split was originally sized
        # for, so a shard is no longer "under" it; a fresh runner per shard
        # is still what keeps memory accumulation bounded. Two real bugs
        # were fixed before reaching for sharding (webhook race in c8ac9d4,
        # APScheduler thread drain in 20c42cf) — sharding mitigates only
        # the residual environmental flakes, not real regressions.
        #
        # --shard-id is 0-indexed; matrix index is 1-indexed for the
        # GH status check display ("e2e (shard 3/4)"). Shell arithmetic
        # below maps 1->0, 2->1, etc.
        #
        # No --reruns — the underlying flake was a 600ms setTimeout
        # auto-advance in setup.html racing Playwright's stability
        # check on ``#step1Next`` (every wizard-driving test went
        # amber). Auto-advance removed at the source, so reruns are
        # no longer needed to paper over it. ``pytest-rerunfailures``
        # stays installed but the e2e command no longer requests it,
        # so a real regression fails immediately instead of after
        # three slow attempts.
        run: >-
          pytest -m e2e -n 0 --no-cov --tb=short --timeout=120 --maxfail=1
          --shard-id=$((${{ matrix.shard }} - 1)) --num-shards=4
        # 10 minutes was sized for a ~38-test shard. The largest shard is now
        # 107 tests and takes 110s serially on a fast 32-core box; a GH runner
        # is several times slower than that, which left almost no headroom
        # before a slow run started failing as a timeout rather than a test.
        # 25 minutes is ~13x the measured local wall time — still short enough
        # to catch a genuine hang, since the real backstop for one stuck test
        # is --timeout=120 above.
        timeout-minutes: 25

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Shard suffix prevents collision when multiple shards fail
          # in the same run — actions/upload-artifact@v7 errors on
          # duplicate names instead of merging.
          name: playwright-traces-shard-${{ matrix.shard }}
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-real-vendors:
    # Real Plex + Emby + Jellyfin in CI via the docker-compose.test.yml
    # stack under tests/integration/. Boots all three vendors with seeded
    # synthetic media, configures admin users via API, and runs the
    # @pytest.mark.integration suite against them.
    #
    # Opt-in only — gated on:
    #   * the workflow_dispatch event (manual trigger), OR
    #   * a PR labeled `e2e-real-vendors`.
    # Otherwise it would add ~5–8 min to every push and routinely break
    # on vendor image updates (Jellyfin schema migrations etc.).
    #
    # Plex needs PLEX_CLAIM (4-min validity from https://plex.tv/claim)
    # via the workflow_dispatch input or a long-lived secret. Without
    # it the Plex tests are skipped; Emby + Jellyfin still run.
    runs-on: ubuntu-24.04
    needs: [lint, test, ffmpeg-build]
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-real-vendors')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mediainfo
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: mediainfo

      - name: Install and verify runtime FFmpeg
        uses: ./.github/actions/install-runtime-ffmpeg

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Generate synthetic test media
        working-directory: tests/integration
        run: bash generate_test_media.sh

      - name: Bring up vendor stack
        working-directory: tests/integration
        env:
          # Optional: set repo secret PLEX_CLAIM_TOKEN for Plex tests.
          # When unset, Plex still boots but stays unclaimed; tests that
          # need a claimed Plex skip cleanly via the auto-skip in conftest.
          PLEX_CLAIM: ${{ secrets.PLEX_CLAIM_TOKEN }}
        run: |
          # PUID/PGID = the runner user so Jellyfin's bind-mounted config
          # (./jellyfin-config) is writable: setup_servers.py injects the API
          # key + installs the plugin, and the off-media test writes trickplay
          # into Jellyfin's data folder.
          PUID="$(id -u)"
          PGID="$(id -g)"
          export PUID PGID
          docker compose -f docker-compose.test.yml up -d
          # Wait for healthchecks (compose has them on each service).
          for i in {1..60}; do
            healthy=$(docker compose -f docker-compose.test.yml ps --format json | jq -r '.[] | select(.Health == "healthy") | .Name' | wc -l)
            if [ "$healthy" -ge 2 ]; then
              echo "At least Emby + Jellyfin healthy (Plex may still be initialising)"
              break
            fi
            echo "Waiting for vendor stack (iteration $i)... ${healthy}/3 healthy"
            sleep 5
          done

      - name: Configure servers via API
        working-directory: tests/integration
        run: python setup_servers.py
        # setup_servers.py creates admin users + libraries on each
        # reachable vendor. Skips any vendor that didn't come up.
        continue-on-error: true

      - name: Credit text prerequisites (model and font)
        # tests/markers/credits' integration-marked real-model tests skip without the models and the DejaVu font;
        # fetch the models the same pinned, sha256-checked way the image does.
        run: |
          set -euo pipefail
          python3 scripts/fetch_textdet_model.py --out "$RUNNER_TEMP/models"
          if [[ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi

      - name: Run integration tests
        env:
          PLEX_CLAIM: ${{ secrets.PLEX_CLAIM_TOKEN }}
          MEDIA_PREVIEW_TEXTDET_MODEL: ${{ runner.temp }}/models/ch_PP-OCRv4_det_infer.onnx
          MEDIA_PREVIEW_TEXTREC_MODEL: ${{ runner.temp }}/models/latin_PP-OCRv5_rec_mobile.onnx
        # The default 30s per-test limit kills a worker outright (timeout-method=thread) when a real CPU encode
        # or the 50-file webhook flood runs on a shared 4-core runner; these tests drive real servers and FFmpeg.
        # Serial (-n 0): many tests publish for the same test films on the same three servers, and in parallel
        # one test's cleanup deleted the previews another was still checking.
        run: pytest -m integration -n 0 --no-cov --tb=short -rs --timeout=300 tests/integration/ tests/markers/credits/ tests/journeys/test_journey_startup_gate.py
        timeout-minutes: 45

      - name: Vendor stack logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose -f docker-compose.test.yml logs --tail=200

      - name: Tear down vendor stack
        if: always()
        working-directory: tests/integration
        run: docker compose -f docker-compose.test.yml down -v

  arm64-image-check:
    # The `build` job below only runs on pushes and manual runs, so without this a PR never proves the arm64 image
    # builds — and the image carries native wheels (onnxruntime, opencv-python-headless, pyclipper, numpy) that must
    # exist for linux/arm64. Builds natively on GitHub's free arm64 runner and only loads the image into this
    # runner's Docker: no push, no registry login, no secrets, no :dev / :latest tag. Then checks that the credit
    # text detector and reader run inside it and that their models are the ones the Dockerfile's fetch step pins.
    name: arm64 image (build and check, no push)
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CHECK_IMAGE: media-preview-generator-arm64-check:local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # This job doesn't log in to Docker Hub, so base images come through Google's Docker Hub mirror: anonymous
          # pulls from shared runners hit Docker Hub's rate limit (429). BuildKit falls back to Docker Hub on a miss.
          # BuildKit's own image too: setup-buildx pulls it from Docker Hub before the mirror above applies.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build linux/arm64 (loaded locally, never pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ env.CHECK_IMAGE }}
          build-args: |
            GIT_BRANCH=pr-${{ github.event.pull_request.number }}
            GIT_SHA=${{ github.sha }}
          # Reads the arm64 layers dev's `build` job saved (a PR into dev may read its base branch's cache) and
          # writes none: every PR's full arm64 layers would crowd those publishing caches out of the repo's 10 GB.
          cache-from: type=gha,scope=linux/arm64

      - name: The image is linux/arm64
        run: |
          set -euo pipefail
          arch="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$CHECK_IMAGE")"
          if [[ "$arch" != "linux/arm64" ]]; then
            echo "::error::Built $arch, expected linux/arm64"
            exit 1
          fi

      - name: The patched loudness analyser runs and carries its source
        run: |
          docker run --rm -i --entrypoint python3 "$CHECK_IMAGE" - <<'PY'
          from pathlib import Path
          import subprocess
          from media_preview_generator.loudness.analyze import resolve_ffmpeg

          root = Path("/opt/ffmpeg-loudness")
          binary = root / "bin/ffmpeg"
          for name in ("ffmpeg-8.1.2.tar.xz", "ebur128.patch", "README.md", "configure-args.txt"):
              assert (root / "share/source" / name).is_file(), name
              assert (root / "share/source" / name).stat().st_size > 0, name
          assert resolve_ffmpeg("/usr/local/bin/ffmpeg") == str(binary)
          subprocess.run([str(binary), "-version"], check=True, stdout=subprocess.DEVNULL)
          filters = subprocess.run([str(binary), "-filters"], check=True, capture_output=True, text=True)
          assert " loudnorm " in filters.stdout
          PY

      - name: The default FFmpeg provides required media features
        run: |
          docker run --rm --entrypoint ffmpeg "$CHECK_IMAGE" -hide_banner -loglevel error -f lavfi -i testsrc2=size=64x64:rate=1 -vf zscale=w=32:h=32 -frames:v 1 -f null -
          docker run --rm --entrypoint ffmpeg "$CHECK_IMAGE" -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=2 -f chromaprint -

      - name: The credit text detector and reader run in the image
        run: >-
          docker run --rm --entrypoint python3 "$CHECK_IMAGE"
          -m media_preview_generator.markers.credits.textdet_helper --check

      - name: The image's models are the ones the Dockerfile's fetch step pins
        run: |
          set -euo pipefail
          check() {
            local path="$1" pin="$2" expected actual
            expected="$(python3 -c "import runpy; print(runpy.run_path('scripts/fetch_textdet_model.py')['$pin'])")"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Could not read $pin from scripts/fetch_textdet_model.py (got '$expected')"
              exit 1
            fi
            read -r actual _ < <(docker run --rm --entrypoint sha256sum "$CHECK_IMAGE" "$path")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$path is $actual, the fetch step pins $expected"
              exit 1
            fi
            echo "$path matches the pin ($expected)"
          }
          check /app/models/ch_PP-OCRv4_det_infer.onnx MODEL_SHA256
          check /app/models/latin_PP-OCRv5_rec_mobile.onnx REC_SHA256

  marker-agent-image:
    # The Plex database node (nodes/plex-db/, the former Plex marker agent) installs the app's wheel with --no-deps,
    # so the only libraries in that image are the ones requirements.lock.txt names. tests/nodes/test_plex_db_role.py
    # can't see when that stops being enough: it imports the role inside a full dev environment, so a new
    # module-scope `import numpy` anywhere on its path (nodes/server/, markers/publishers/, loudness's database
    # modules, library_health/plex_rows.py) would leave every one of those tests green and still kill the container
    # at boot. Nothing else in CI builds this image. This job is what proves the --no-deps install still works: it
    # builds it, boots it and calls it.
    #
    # Runs on every event this workflow handles, with no `if:` of its own (only `needs: lint`). paths-ignore doesn't exclude
    # nodes/, and `*.md` only matches top-level markdown (a GitHub path glob's `*` doesn't cross `/`),
    # so a change anywhere in that folder reaches this job. amd64 only — the release workflow
    # (.github/workflows/marker-agent.yml) builds arm64 on a native runner, and the image has no compiled code, so
    # an arm64 build here would only re-prove the same pure-Python wheels.
    name: Plex marker agent image (build, boot, call)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CHECK_IMAGE: plex-marker-agent:ci
      CONTAINER: plex-marker-agent-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # This job doesn't log in to Docker Hub, so base images come through Google's Docker Hub mirror: anonymous
          # pulls from shared runners hit Docker Hub's rate limit (429). BuildKit falls back to Docker Hub on a miss.
          # BuildKit's own image too: setup-buildx pulls it from Docker Hub before the mirror above applies.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build the agent image (loaded locally, never pushed)
        uses: docker/build-push-action@v7
        with:
          # The repository root: the image installs the app's own source, which is what the agent runs.
          context: .
          file: nodes/plex-db/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.CHECK_IMAGE }}
          # No GHA layer cache, deliberately. A fork's pull_request run gets a read-only cache token, and
          # `cache-to` then fails the whole build (the same hardening docker-pr.yml documents). A cold build of
          # this image is ~74s locally — a few minutes on a runner — so there is nothing worth that risk.

      - name: Boot it and call it
        run: |
          set -euo pipefail
          # A throwaway key for this one container, generated here and masked out of the log. Without one the node
          # would generate its own; passing it is how the calls below know it. Never committed, never leaves this job.
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"

          # A small Plex config folder (the 1.43 schema with one film, and Preferences.xml naming "ci-plex"), so the
          # loudness and Library Health routes below run the app's own database code inside the image.
          config_dir="$RUNNER_TEMP/plex-config"
          python3 scripts/plex_db_node_fixture.py "$config_dir" ci-plex
          trap 'docker logs "$CONTAINER" 2>&1 | tail -40 || true; docker rm -f -v "$CONTAINER" >/dev/null 2>&1 || true' EXIT

          # As the user that owns the database, the way the README runs it beside Plex.
          docker run -d --name "$CONTAINER" \
            --user "$(id -u):$(id -g)" \
            -e AGENT_TOKEN="$token" \
            -e PLEX_CONFIG_DIR=/plex \
            -v "$config_dir:/plex" \
            -p 127.0.0.1:9494:9494 \
            "$CHECK_IMAGE"

          # The image's own HEALTHCHECK hits /v1/health, so "healthy" already means the node server imported the app —
          # which is the --no-deps claim under test.
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo gone)"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            if [[ "$status" == "gone" || "$status" == "unhealthy" ]]; then
              echo "::error::Container went $status before it became healthy"
              exit 1
            fi
            sleep 2
          done
          if [[ "$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")" != "healthy" ]]; then
            echo "::error::Container never became healthy"
            exit 1
          fi
          echo "Container is healthy"

          # /v1/health takes no key and still carries the agent block old apps read; /v1/ping needs one and reaches
          # the app's own plex_db code.
          curl -fsS http://127.0.0.1:9494/v1/health > health.json
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:9494/v1/ping > ping.json
          jq -e '.ok == true and (.agent.version | type == "string")' health.json > /dev/null
          jq -e '.ok == true and .result.db_present == true and .result.machine_identifier == "ci-plex"' ping.json \
            > /dev/null

          # The loudness readiness check and Library Health's queries, on the fixture database. No Plex holds the
          # database open here, so the loudness report isn't "ready"; that it answers with a report at all proves
          # loudness's database modules load and run in the image.
          auth=(-H "Authorization: Bearer $token" -H "X-Marker-Agent-Protocol: 1" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" -d '{"machine_identifier": "ci-plex", "pms_version": "1.43.4.10903-ab12cd34", "deadline_s": 5}' \
            http://127.0.0.1:9494/v1/loudness/check > loudness.json
          jq -e '.ok == true and .result.capability == "loudness_v1" and (.result.report.state | type == "string")' \
            loudness.json > /dev/null
          curl -fsS "${auth[@]}" -d '{"section_ids": [1], "machine_identifier": "ci-plex", "deadline_s": 5}' \
            http://127.0.0.1:9494/v1/library-health/rows > rows.json
          jq -e '.ok == true and .result.capability == "library_health_v1" and (.result.rows.parts | length == 1)' \
            rows.json > /dev/null
          # The node's own folder is a volume (the image declares one), so the undo record survives a recreate.
          docker inspect -f '{{range .Mounts}}{{.Destination}} {{end}}' "$CONTAINER" | grep -qw /config

          # An unauthenticated call is refused and says nothing about this Plex.
          code="$(curl -s -o unauth.json -w '%{http_code}' http://127.0.0.1:9494/v1/ping)"
          if [[ "$code" != "401" ]]; then
            echo "::error::/v1/ping without a key answered $code, expected 401"
            exit 1
          fi
          jq -e '.ok == false and .error.kind == "auth" and (.error | has("message") | not)' unauth.json > /dev/null

          # The image reports the version the source says it should, so a stale build can't be published quietly.
          expected="$(python3 -c 'import ast, sys; body = ast.parse(open(sys.argv[1]).read()).body; print(next(n.value.value for n in body if isinstance(n, ast.Assign) and any(getattr(t, "id", "") == "AGENT_VERSION" for t in n.targets)))' media_preview_generator/nodes/server/plex_db.py)"
          actual="$(jq -r '.agent.version' ping.json)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The image reports agent version $actual, nodes/server/plex_db.py says $expected"
            exit 1
          fi
          echo "Agent $actual answered /v1/health and /v1/ping, and refused a call without the key"

