name: Container image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Keep the first build's provenance in the registry, but do not give it
      # the installable commit tag until an independent cold build is compared.
      - name: First cold build (push by digest)
        id: first
        uses: docker/build-push-action@v6
        with:
          context: .
          no-cache: true
          outputs: type=image,name=ghcr.io/nphil/reprise,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
            DOCKER_IMAGE_NAME=ghcr.io/nphil/reprise
      - name: Second cold build (local comparison only)
        uses: docker/build-push-action@v6
        with:
          context: .
          no-cache: true
          load: true
          tags: reprise:cold-comparison
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
            DOCKER_IMAGE_NAME=ghcr.io/nphil/reprise
      - name: Compare runtime configuration and uncompressed layers
        env:
          FIRST_IMAGE: ghcr.io/nphil/reprise@${{ steps.first.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$FIRST_IMAGE"
          for image in "$FIRST_IMAGE" reprise:cold-comparison; do
            docker image inspect "$image" | jq -S '.[0] | {Architecture, Os, Variant, Config, RootFS}' > "${RUNNER_TEMP}/$(if [ "$image" = "$FIRST_IMAGE" ]; then echo first; else echo second; fi).json"
          done
          diff -u "${RUNNER_TEMP}/first.json" "${RUNNER_TEMP}/second.json"
          echo "Runtime configuration and uncompressed layer digests match. OCI provenance is not compared."
      - name: Verify both candidate images before publication
        env:
          FIRST_IMAGE: ghcr.io/nphil/reprise@${{ steps.first.outputs.digest }}
        run: |
          set -euo pipefail
          container="reprise-candidate-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container" 2>/dev/null || true; docker rm -f -v "$container" >/dev/null 2>&1 || true' EXIT
          for image in "$FIRST_IMAGE" reprise:cold-comparison; do
            echo "Checking $image"
            license="$(docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg "$image" -L 2>&1)"
            printf '%s\n' "$license"
            printf '%s\n' "$license" | grep -F -- 'GNU General Public License'
            buildconf="$(docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg "$image" -buildconf 2>&1)"
            printf '%s\n' "$buildconf"
            printf '%s\n' "$buildconf" | grep -E -- '^[[:space:]]*--enable-gpl[[:space:]]*$'
            if printf '%s\n' "$buildconf" | grep -F -- '--enable-nonfree'; then
              echo 'Nonfree FFmpeg configuration must not be published' >&2
              exit 1
            fi
            docker run --rm -i --network none --entrypoint python3 "$image" - <<'PY'
          from pathlib import Path

          source = Path('/opt/ffmpeg-gpl/share/source')
          loudness = Path('/opt/ffmpeg-loudness/share/source')

          def require_file(path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty artifact: {path}')

          def require_glob(directory, pattern):
              matches = list(directory.glob(pattern))
              if not matches:
                  raise SystemExit(f'Missing artifact: {directory / pattern}')
              for path in matches:
                  require_file(path)

          for name in ('Dockerfile', 'build.sh', 'build-packages.tsv', 'apt/policy.txt',
                       'runtime-library-notices/owners.tsv', 'ffmpeg/COPYING.GPLv2',
                       'ffmpeg/COPYING.GPLv3', 'ffmpeg/COPYING.LGPLv2.1',
                       'ffmpeg/COPYING.LGPLv3', 'ffmpeg/LICENSE.md', 'x264/COPYING',
                       'chromaprint/copyright', 'zimg/copyright'):
              require_file(source / name)
          require_glob(source / 'ffmpeg', 'ffmpeg-*.tar.xz')
          for package in ('x264', 'chromaprint', 'zimg'):
              require_glob(source / package, '*.dsc')
              require_glob(source / package, '*.tar.*')
          notices = source / 'runtime-library-notices'
          for line in (notices / 'owners.tsv').read_text().splitlines():
              fields = line.split('\t')
              if len(fields) < 4 or not fields[3]:
                  raise SystemExit(f'Invalid library owner record: {line!r}')
              require_file(notices / (fields[3].split(':', 1)[0] + '.copyright'))
          require_glob(loudness, 'ffmpeg-*.tar.xz')
          for name in ('ebur128.patch', 'COPYING.LGPLv2.1'):
              require_file(loudness / name)
          PY
            docker run -d --name "$container" --network none --tmpfs /config:rw -e PUID=1000 -e PGID=1000 "$image"
            healthy=false
            for _ in {1..60}; do
              state="$(docker inspect -f '{{.State.Status}}' "$container")"
              health="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
              if [ "$health" = healthy ]; then healthy=true; break; fi
              if [ "$state" != running ] || [ "$health" = unhealthy ]; then break; fi
              sleep 3
            done
            if [ "$healthy" != true ]; then
              docker inspect -f '{{json .State.Health}}' "$container"
              echo "Candidate failed to become healthy: $image" >&2
              exit 1
            fi
            docker rm -f -v "$container" >/dev/null
          done
      - name: Publish verified commit image
        env:
          FIRST_IMAGE: ghcr.io/nphil/reprise@${{ steps.first.outputs.digest }}
          COMMIT_IMAGE: ghcr.io/nphil/reprise:sha-${{ github.sha }}
        run: docker buildx imagetools create --tag "$COMMIT_IMAGE" "$FIRST_IMAGE"
