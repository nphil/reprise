name: Container image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set reproducible build timestamp
        id: timestamp
        run: echo "epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Cold build (push by digest)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          no-cache: true
          outputs: type=image,name=ghcr.io/nphil/reprise,push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.timestamp.outputs.epoch }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
            DOCKER_IMAGE_NAME=ghcr.io/nphil/reprise
      - name: Verify candidate image before publication
        env:
          CANDIDATE_IMAGE: ghcr.io/nphil/reprise@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE_IMAGE"
          container="reprise-candidate-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container" 2>/dev/null || true; docker rm -f -v "$container" >/dev/null 2>&1 || true' EXIT
          echo "Checking $CANDIDATE_IMAGE"
          license="$(docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg "$CANDIDATE_IMAGE" -L 2>&1)"
            printf '%s\n' "$license"
            printf '%s\n' "$license" | grep -F -- 'GNU General Public License'
          buildconf="$(docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg "$CANDIDATE_IMAGE" -buildconf 2>&1)"
            printf '%s\n' "$buildconf"
            printf '%s\n' "$buildconf" | grep -E -- '^[[:space:]]*--enable-gpl[[:space:]]*$'
            if printf '%s\n' "$buildconf" | grep -F -- '--enable-nonfree'; then
              echo 'Nonfree FFmpeg configuration must not be published' >&2
              exit 1
            fi
            for flag in --enable-ffnvcodec --enable-cuda --enable-cuvid --enable-nvdec --enable-vaapi; do
              printf '%s\n' "$buildconf" | grep -E -- "^[[:space:]]*${flag}[[:space:]]*$" \
                || { echo "FFmpeg was not configured with $flag" >&2; exit 1; }
            done
          hwaccels="$(docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg "$CANDIDATE_IMAGE" -hide_banner -hwaccels 2>&1)"
            printf '%s\n' "$hwaccels"
            for accel in cuda vaapi; do
              printf '%s\n' "$hwaccels" | grep -x -- "$accel" \
                || { echo "FFmpeg does not list the $accel hardware accelerator" >&2; exit 1; }
            done
          for kind in decoders filters; do
            docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg "$CANDIDATE_IMAGE" -hide_banner "-$kind" > "ffmpeg-$kind.txt" 2>&1
          done
            for name in h264_cuvid hevc_cuvid; do grep -E "[[:space:]]${name}[[:space:]]" ffmpeg-decoders.txt >/dev/null || { echo "Missing decoder $name" >&2; exit 1; }; done
            for name in scale_cuda scale_vaapi hwupload_cuda hwdownload; do grep -E "[[:space:]]${name}[[:space:]]" ffmpeg-filters.txt >/dev/null || { echo "Missing filter $name" >&2; exit 1; }; done
          docker run --rm -i --network none --entrypoint python3 "$CANDIDATE_IMAGE" - <<'PY'
          from pathlib import Path

          source = Path('/opt/ffmpeg-gpl/share/source')
          loudness = Path('/opt/ffmpeg-loudness/share/source')

          def require_file(path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty artifact: {path}')

          def require_glob(directory, pattern):
              matches = list(directory.glob(pattern))
              if not matches:
                  raise SystemExit(f'Missing artifact: {directory / pattern}')
              for path in matches:
                  require_file(path)

          for name in ('Dockerfile', 'build.sh', 'build-packages.tsv', 'apt/policy.txt',
                       'runtime-library-notices/owners.tsv', 'ffmpeg/COPYING.GPLv2',
                       'ffmpeg/COPYING.GPLv3', 'ffmpeg/COPYING.LGPLv2.1',
                       'ffmpeg/COPYING.LGPLv3', 'ffmpeg/LICENSE.md', 'x264/COPYING',
                       'chromaprint/copyright', 'zimg/copyright', 'nv-codec-headers/copyright'):
              require_file(source / name)
          require_glob(source / 'ffmpeg', 'ffmpeg-*.tar.xz')
          for package in ('x264', 'chromaprint', 'zimg', 'nv-codec-headers'):
              require_glob(source / package, '*.dsc')
              require_glob(source / package, '*.tar.*')
          notices = source / 'runtime-library-notices'
          for line in (notices / 'owners.tsv').read_text().splitlines():
              fields = line.split('\t')
              if len(fields) < 4 or not fields[3]:
                  raise SystemExit(f'Invalid library owner record: {line!r}')
              require_file(notices / (fields[3].split(':', 1)[0] + '.copyright'))
          owned = {line.split('\t')[0] for line in (notices / 'owners.tsv').read_text().splitlines()}
          for soname in ('libva.so.2', 'libva-drm.so.2'):
              if soname not in owned:
                  raise SystemExit(f'Missing library notice for {soname}')
          require_glob(loudness, 'ffmpeg-*.tar.xz')
          for name in ('ebur128.patch', 'COPYING.LGPLv2.1'):
              require_file(loudness / name)
          PY
          docker run -d --name "$container" --network none --tmpfs /config:rw -e PUID=1000 -e PGID=1000 "$CANDIDATE_IMAGE"
            healthy=false
            for _ in {1..60}; do
              state="$(docker inspect -f '{{.State.Status}}' "$container")"
              health="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
              if [ "$health" = healthy ]; then healthy=true; break; fi
              if [ "$state" != running ] || [ "$health" = unhealthy ]; then break; fi
              sleep 3
            done
            if [ "$healthy" != true ]; then
              docker inspect -f '{{json .State.Health}}' "$container"
              echo "Candidate failed to become healthy: $CANDIDATE_IMAGE" >&2
              exit 1
            fi
            docker rm -f -v "$container" >/dev/null
      - name: Publish verified commit image
        env:
          IMAGE: ghcr.io/nphil/reprise@${{ steps.image.outputs.digest }}
          COMMIT_IMAGE: ghcr.io/nphil/reprise:sha-${{ github.sha }}
        run: docker buildx imagetools create --tag "$COMMIT_IMAGE" "$IMAGE"
